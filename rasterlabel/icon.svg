  <g stroke="#cfc8bb" stroke-width="0.8">
    <path d="M7.5 2v20M12.5 2v20M17.5 2v20M2 7.5h20M2 12.5h20M2 17.5h20"/>
  </g>
  <path d="M2.5 12.5h5v-5h5v5h5v5h-10v-5z"
        fill="#d95f02" fill-opacity="0.75" stroke="#a84702" stroke-width="1.2"
        stroke-linejoin="miter"/>
  <path d="M12.5 2.5h10v5h-5v5h-5z"
